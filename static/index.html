<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>study-tracker</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0f1115">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <button type="button" id="settings-btn" class="icon-btn" aria-label="設定">⚙️</button>
  <h1>study-tracker</h1>
</header>

<main id="app">

  <section id="tab-todo" class="tab-panel active">
    <h2>ToDo</h2>

    <div class="filter-bar">
      <input type="text" id="todo-search" placeholder="🔍 検索">
      <select id="todo-filter-category">
        <option value="">カテゴリ: すべて</option>
        <option value="英語">英語</option>
        <option value="数学">数学</option>
        <option value="世界史">世界史</option>
        <option value="その他">その他</option>
      </select>
      <label class="checkbox-label"><input type="checkbox" id="todo-filter-today"> 今日の分だけ</label>
    </div>

    <div id="todo-groups"></div>

    <h3>完了実績</h3>
    <div id="todo-stats"></div>

    <button type="button" id="todo-fab" class="fab" aria-label="タスクを追加">+</button>

    <div id="todo-add-backdrop" class="backdrop hidden"></div>
    <div id="todo-add-panel" class="add-panel hidden">
      <div class="panel-header">
        <h3>新しいタスク</h3>
        <button type="button" id="todo-add-close" class="panel-close" aria-label="閉じる">×</button>
      </div>
      <form id="todo-form" class="add-form">
        <input type="text" id="todo-title" placeholder="タスク名" required>
        <div class="form-row">
          <select id="todo-category">
            <option value="英語">英語</option>
            <option value="数学">数学</option>
            <option value="世界史">世界史</option>
            <option value="その他">その他</option>
          </select>
          <select id="todo-priority">
            <option value="high">優先度: 高</option>
            <option value="medium" selected>優先度: 中</option>
            <option value="low">優先度: 低</option>
          </select>
        </div>
        <div class="due-row">
          <input type="date" id="todo-due-date">
          <button type="button" class="quick-date-btn" data-quick="today">今日</button>
          <button type="button" class="quick-date-btn" data-quick="tomorrow">明日</button>
          <button type="button" class="quick-date-btn" data-quick="nextweek">来週</button>
          <button type="button" class="quick-date-btn" data-quick="clear">クリア</button>
        </div>
        <button type="button" id="todo-time-toggle" class="time-toggle-btn">+ 時刻を追加</button>
        <input type="time" id="todo-due-time" style="display:none;">
        <div class="due-row">
          <button type="button" class="quick-date-btn" data-recur-preset="daily">毎日</button>
          <button type="button" class="quick-date-btn" data-recur-preset="weekdays">平日</button>
          <button type="button" class="quick-date-btn" data-recur-preset="clear">クリア</button>
        </div>
        <div class="weekday-picker" id="todo-recurrence-picker">
          <button type="button" class="weekday-btn" data-day="sun">日</button>
          <button type="button" class="weekday-btn" data-day="mon">月</button>
          <button type="button" class="weekday-btn" data-day="tue">火</button>
          <button type="button" class="weekday-btn" data-day="wed">水</button>
          <button type="button" class="weekday-btn" data-day="thu">木</button>
          <button type="button" class="weekday-btn" data-day="fri">金</button>
          <button type="button" class="weekday-btn" data-day="sat">土</button>
        </div>
        <button type="submit">+ 追加</button>
      </form>
    </div>
  </section>

  <section id="tab-diary" class="tab-panel">
    <h2>日記</h2>
    <div class="diary-editor">
      <label id="diary-date-label" for="diary-content"></label>
      <textarea id="diary-content" rows="8" placeholder="今日あったこと..."></textarea>
      <button id="diary-save">保存</button>
      <span id="diary-status"></span>
    </div>
    <h3>過去の日記</h3>
    <ul id="diary-list" class="list"></ul>
  </section>

  <section id="tab-study" class="tab-panel">
    <h2>学習ログ</h2>
    <div class="study-buttons" id="study-buttons"></div>

    <button type="button" id="manual-log-toggle" class="quick-date-btn">+ 手動で記録</button>
    <form id="manual-log-form" class="add-form hidden">
      <select id="manual-log-subject" required></select>
      <input type="number" id="manual-log-minutes" placeholder="分" min="1" required>
      <input type="datetime-local" id="manual-log-datetime" required>
      <input type="text" id="manual-log-note" placeholder="メモ(任意)">
      <button type="submit">追加</button>
    </form>

    <h3>目標</h3>
    <div class="goal-progress-card">
      <div class="goal-progress-row">
        <span>今週</span>
        <span class="meta" id="week-progress-label"></span>
      </div>
      <div class="stat-bar-track"><div class="stat-bar-fill" id="week-progress-fill"></div></div>
    </div>
    <div class="goal-progress-card">
      <div class="goal-progress-row">
        <span>今月</span>
        <span class="meta" id="month-progress-label"></span>
      </div>
      <div class="stat-bar-track"><div class="stat-bar-fill" id="month-progress-fill"></div></div>
    </div>
    <form id="goal-minutes-form" class="add-form">
      <input type="number" id="weekly-goal-input" placeholder="週間目標(時間)" min="0" step="0.5">
      <input type="number" id="monthly-goal-input" placeholder="月間目標(時間)" min="0" step="0.5">
      <button type="submit">保存</button>
    </form>

    <div class="stats-header">
      <div class="stat-cell"><span class="stat-label">今日</span><span class="stat-value" id="stat-today"></span></div>
      <div class="stat-cell"><span class="stat-label">今月</span><span class="stat-value" id="stat-month"></span></div>
      <div class="stat-cell"><span class="stat-label">累計</span><span class="stat-value" id="stat-total"></span></div>
    </div>

    <div class="chart-header-row">
      <h3 id="study-chart-title">直近10週間</h3>
      <div class="period-toggle">
        <button type="button" class="period-btn active" data-granularity="week">週</button>
        <button type="button" class="period-btn" data-granularity="day">日</button>
      </div>
    </div>
    <div id="study-chart"></div>
    <p class="meta" id="study-chart-detail">棒をタップすると内訳が表示されます</p>

    <h3>直近7日間の合計</h3>
    <ul id="study-summary" class="list"></ul>

    <h3>ログ履歴</h3>
    <ul id="study-log-list" class="list"></ul>
  </section>

  <section id="tab-goal" class="tab-panel">
    <h2>目標達成度</h2>
    <div id="countdown"></div>
    <ul id="goal-list" class="list"></ul>
    <form id="goal-form" class="add-form">
      <input type="text" id="goal-title" placeholder="達成したい項目(例: 単語1800語)" required>
      <button type="submit">+ 追加</button>
    </form>
    <div id="goal-progress"></div>
  </section>

</main>

<div id="focus-overlay" class="focus-overlay hidden">
  <div class="focus-subject">
    <span class="rec-dot"></span>
    <span id="focus-subject-name"></span>
  </div>
  <div class="focus-ring-wrap">
    <svg class="focus-ring" viewBox="0 0 120 120">
      <circle class="focus-ring-track" cx="60" cy="60" r="54"></circle>
      <circle class="focus-ring-fill" id="focus-ring-fill" cx="60" cy="60" r="54"></circle>
    </svg>
    <div class="focus-timer" id="focus-timer">00:00</div>
  </div>
  <div class="focus-controls">
    <button type="button" id="focus-pause-btn" class="secondary">一時停止</button>
    <button type="button" id="focus-stop-btn">記録して停止</button>
  </div>
</div>

<div id="settings-backdrop" class="backdrop hidden"></div>
<div id="settings-panel" class="add-panel hidden">
  <div class="panel-header">
    <h3>設定</h3>
    <button type="button" id="settings-close" class="panel-close" aria-label="閉じる">×</button>
  </div>
  <h3>カテゴリ管理</h3>
  <ul id="category-list" class="list"></ul>
  <form id="category-form" class="add-form">
    <input type="text" id="category-name" placeholder="新しいカテゴリ名" required>
    <button type="submit">+ 追加</button>
  </form>
</div>

<nav id="tabbar">
  <button class="tab-btn active" data-tab="tab-todo">ToDo</button>
  <button class="tab-btn" data-tab="tab-diary">日記</button>
  <button class="tab-btn" data-tab="tab-study">学習ログ</button>
  <button class="tab-btn" data-tab="tab-goal">目標</button>
</nav>

<script src="/static/app.js"></script>
</body>
</html>
