services:
  - type: web
    name: study-tracker
    runtime: python
    buildCommand: "pip install -r requirements.txt && git log -1 --format=%cI > build_info.txt"
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_CLAIMS_EMAIL
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DEVICE_TOKEN
        sync: false
      - key: PIN_CUSTODY_TOKEN
        sync: false
      - key: VOCAB_APP_TOKEN
        sync: false
      - key: VOCAB_APP_ORIGIN
        sync: false
